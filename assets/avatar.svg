      <path d="M192 241 C203 218 240 217 253 236" fill="none" stroke="#2f120b" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M192 241 C189 238 187 236 185 232" fill="none" stroke="#2f120b" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M198 247 C210 253 236 253 248 241" fill="none" stroke="#c78e78" stroke-width="1.4" opacity="0.7"/>
      <path d="M200 226 C212 218 234 217 246 224" fill="none" stroke="#d99f84" stroke-width="1.6" opacity="0.55"/>
