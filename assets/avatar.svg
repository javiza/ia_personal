    <path d="M168 232 C142 300 134 392 112 470 C156 452 178 396 184 336 C187 296 180 262 168 232 Z" fill="url(#hair)"/>
    <path d="M344 232 C370 300 378 392 400 470 C356 452 334 396 328 336 C325 296 332 262 344 232 Z" fill="url(#hair)"/>
    <g fill="none" stroke="#ffb27a" stroke-linecap="round" opacity="0.5">
