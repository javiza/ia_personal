    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2b4a"/><stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeL"><path d="M194 239 C205 221 239 220 250 237 C239 250 206 251 194 239 Z"/></clipPath>
  </defs>

