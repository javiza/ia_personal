      <stop offset="0" stop-color="#27456f"/><stop offset="0.6" stop-color="#101d36"/><stop offset="1" stop-color="#070c18"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe3d3"/><stop offset="0.6" stop-color="#f4cdb5"/><stop offset="1" stop-color="#ecbb9f"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a487"/><stop offset="1" stop-color="#ecbb9f"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2602b"/><stop offset="0.5" stop-color="#b8361a"/><stop offset="1" stop-color="#7e1f10"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a62e15"/><stop offset="1" stop-color="#5e140a"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#8fd8ff"/><stop offset="0.45" stop-color="#2d8fe0"/><stop offset="1" stop-color="#0d4a96"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
